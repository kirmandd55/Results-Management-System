<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-5">
    <div class="main-card">

        <h1 class="text-center mb-4">نظام إدارة نتائج الطلاب</h1>

        <h4 class="mb-3">إضافة طالب جديد</h4>

        <div class="mb-3">
            <label class="form-label">اسم الطالب</label>
            <input type="text" id="studentName" class="form-control"
                   placeholder="أدخل اسم الطالب">
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">المادة الأولى</label>
                <input type="number" id="subject1" class="form-control">
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">المادة الثانية</label>
                <input type="number" id="subject2" class="form-control">
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">المادة الثالثة</label>
                <input type="number" id="subject3" class="form-control">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">نسبة الحضور</label>
            <input type="number" id="attendance" class="form-control">
        </div>

        <div id="errorBox" class="alert alert-danger d-none"></div>

        <div id="successBox" class="alert alert-success d-none"></div>

        <div class="d-grid gap-2 mt-3">
            <button id="addStudent" class="btn btn-primary">
                إضافة طالب
            </button>

            <button id="mercyBtn" class="btn btn-success">
                تفعيل لجنة الرأفة
            </button>
        </div>

        <hr>

        <h4 class="mb-3">قائمة الطلاب</h4>
        <div id="studentsBox" class="students-box">
            لا يوجد طلاب حتى الآن
        </div>

        <hr>

        <h4 class="mb-3">التقرير النهائي للجنة الرأفة</h4>
        <div id="reportBox" class="report-box">
            لم يتم تفعيل لجنة الرأفة بعد
        </div>

    </div>
</div>

<script src="main.js"></script>
</body>
</html>
